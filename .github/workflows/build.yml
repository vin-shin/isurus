# Build and static analysis on every push.
#
# NOT YET RUN. There is no way to execute GitHub Actions from the bench, so
# this has been written against the documented behaviour of each action and
# the exact commands that are known to work locally - but the first push is
# its first real test. Expect to iterate once.
#
# What it deliberately does NOT do: run host unit tests. The host harness the
# work plan asks for does not exist yet, because the machine this was written
# on has no native C compiler. Adding a test step that runs nothing would
# report green for the wrong reason.

name: build

on:
  push:
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi \n                                  cmake ninja-build

      # Both configurations, because they differ in more than optimisation
      # level: Debug carries the per-file -O2 pins that keep the control ISR
      # inside its deadline, Release applies -O2 everywhere. A change that
      # builds under one and not the other is exactly what this should catch.
      - name: Configure Debug
        run: >-
          cmake -S . -B build/Debug -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_TOOLCHAIN_FILE=cmake/gcc-arm-none-eabi.cmake

      - name: Build Debug
        run: cmake --build build/Debug

      - name: Configure Release
        run: >-
          cmake -S . -B build/Release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=cmake/gcc-arm-none-eabi.cmake

      - name: Build Release
        run: cmake --build build/Release

      # Flash and RAM use are worth seeing in the log on every commit - a jump
      # is usually someone accidentally pulling in printf's float formatting.
      - name: Report size
        run: arm-none-eabi-size build/Debug/makolongfin2.elf build/Release/makolongfin2.elf

  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      # Scoped to Core/Src. The vendor HAL and CMSIS are not this project's to
      # fix and would drown the signal.
      #
      # This step is the one that matters most, and its value is UNVERIFIED.
      # The work plan's motivating bug is `errors & !MASK` - logical NOT where
      # bitwise was meant - and that is NOT caught by any GCC warning flag;
      # this was tested, see CMakeLists.txt. cppcheck is expected to flag it as
      # a boolean used in a bitwise operation, which is why this step exists,
      # but that expectation has not been confirmed. Confirm it on the first
      # run by checking cppcheck actually reports a deliberately planted case,
      # rather than trusting a green tick.
      - name: cppcheck
        run: |
          cppcheck --enable=warning,style,performance,portability \
                   --inline-suppr \
                   --suppress=missingIncludeSystem \
                   --suppress=unusedFunction \
                   --error-exitcode=1 \
                   -I Core/Inc \
                   Core/Src

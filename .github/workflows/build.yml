# Build and static analysis on every push.
#
# NOT YET RUN. There is no way to execute GitHub Actions from the bench, so
# this has been written against the documented behaviour of each action and
# the exact commands that are known to work locally - but the first push is
# its first real test. Expect to iterate once.
#
# It also runs the host test suite for foc.c, including the mutant check that
# verifies those tests can actually fail. A green suite that has never been
# seen to go red is not evidence of anything.

name: build

on:
  push:
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi cmake ninja-build

      # Both configurations, because they differ in more than optimisation
      # level: Debug carries the per-file -O2 pins that keep the control ISR
      # inside its deadline, Release applies -O2 everywhere. A change that
      # builds under one and not the other is exactly what this should catch.
      - name: Configure Debug
        run: >-
          cmake -S . -B build/Debug -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_TOOLCHAIN_FILE=cmake/gcc-arm-none-eabi.cmake

      - name: Build Debug
        run: cmake --build build/Debug

      - name: Configure Release
        run: >-
          cmake -S . -B build/Release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=cmake/gcc-arm-none-eabi.cmake

      - name: Build Release
        run: cmake --build build/Release

      # Flash and RAM use are worth seeing in the log on every commit - a jump
      # is usually someone accidentally pulling in printf's float formatting.
      - name: Report size
        run: arm-none-eabi-size build/Debug/makolongfin2.elf build/Release/makolongfin2.elf

  hosttests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Native gcc only - foc.c is compiled for the host here, not for ARM.
      - name: Install gcc
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      # --mutants plants the two bugs this project actually shipped (an angle
      # conversion off by pi, and an anti-windup that scaled the integrators)
      # and fails the job if the suite does NOT catch them. That guard is the
      # reason to trust the green tick above it.
      - name: foc.c host tests
        run: bash test/host/run.sh --mutants

  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      # Scoped to the project's OWN sources, matching the rule CMakeLists.txt
      # already applies to -Wextra -Werror: the vendor HAL and the CubeMX
      # peripheral files are not this project's to fix. Running over all of
      # Core/Src is what kept this job red on every commit from the first one -
      # 14 of its 18 findings were constParameterPointer on HAL callbacks whose
      # signatures the HAL dictates and nobody here can change.
      #
      # main.c IS included despite being generated, because the 30 kHz control
      # ISR lives in its USER CODE section. That is hand-written code on the
      # hard-real-time path and the most valuable thing here to analyse.
      #
      # The include paths matter as much as the scope. With only -I Core/Inc
      # cppcheck cannot see CMSIS, so DWT->CYCCNT is an unknown type rather
      # than a volatile register - it then reported `t_b - t_a` as "same
      # expression on both sides" for ISR stage timings that are deltas of
      # distinct reads. False positives of that shape are worse than no
      # analysis: they teach you to ignore the job.
      #
      # -D__GNUC__ and the Drivers suppression are both about CMSIS. Without
      # the define, cmsis_compiler.h reaches its `#error Unknown compiler` and
      # cppcheck reports that as an error in a vendor header - a red job caused
      # entirely by the analyser not knowing which toolchain this is. Findings
      # inside Drivers/ are suppressed for the same reason the scope excludes
      # them: not this project's code to fix.
      #
      # This step is the one that matters most, and it is now VERIFIED.
      #
      # The work plan's motivating bug is `errors & !MASK` - logical NOT where
      # bitwise was meant - and no GCC warning flag catches it; that was tested
      # separately, see CMakeLists.txt. On 2026-08-25 the case was planted for
      # real, in encoder.c's A1333 ready-bit test, and pushed on a scratch
      # branch. The firmware job compiled it clean and this job went red with:
      #
      #   style: Boolean result is used in bitwise operation.  [clarifyCondition]
      #   style: Condition '(st&!0x0001U)!=0U' is always false [knownConditionTrueFalse]
      #
      # So the green tick below has been seen to go red for the reason it
      # exists, which is the only thing that makes it worth anything.
      #
      # DO NOT DROP `style` FROM --enable. Both of those findings are
      # style-class. Dropping the category to quieten unrelated noise - which
      # is tempting, it is where constParameterPointer lives - silently
      # disables the entire reason this job is here, and the planted bug then
      # passes. Narrow the SCOPE or suppress specific ids instead.
      - name: cppcheck
        run: |
          cppcheck --enable=warning,style,performance,portability \
                   --inline-suppr \
                   --suppress=missingIncludeSystem \
                   --suppress=unusedFunction \
                   --suppress=*:Drivers/* \
                   --error-exitcode=1 \
                   --platform=arm32-wchar_t4 \
                   --std=c11 \
                   -DSTM32G474xx -D__GNUC__=10 \
                   -I Core/Inc \
                   -I Drivers/CMSIS/Include \
                   -I Drivers/CMSIS/Device/ST/STM32G4xx/Include \
                   -I Drivers/STM32G4xx_HAL_Driver/Inc \
                   Core/Src/foc.c Core/Src/drive.c Core/Src/position.c \
                   Core/Src/haptic.c Core/Src/csense.c Core/Src/encoder.c \
                   Core/Src/motor_pwm.c Core/Src/openloop.c Core/Src/can.c \
                   Core/Src/led.c Core/Src/main.c
